    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Form Project - Survey</h1>
        <section class="name-major"> 
        <p>Name:
            <input type="text" name="Name:" size="15" maxlength="30" placeholder="Your name" />
            Major:
            <input type="text" name="Major:" size="15" maxlength="30" placeholder="Your major" />
        </p>
        </section>


        <fieldset>
            <legend>Your Details</legend>
            <p>Email:
                <input type="email" name="Email:" size="15" maxlength="30" placeholder="example@domain.com" />
            </p>
            <p>Gender:
                <input id="female" type="radio" name="Gender:" value="f" /> 
                <label for="female">Female</label>

                <input id="male" type="radio" name="Gender:" value="m" />
                <label for="male">Male</label>
            </p>

            <p>Grade:
                <select name="Grade">
                    <option value="Freshman">Freshman</option>
                    <option value="Sophomore">Sophomore</option>
                    <option value="Junior">Junior</option>
                    <option value="Senior">Senior</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Semester Feedback</legend>

            <p>How is your semester going?
                <select name="feedback">
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="average">Average</option>
                    <option value="poor">Poor</option>
                </select>
            </br>

            <p>
            <label>What subjects are challenging?</label>
            </br>
                <input type="checkbox" name="subjects" value="web"/>Web
                <input type="checkbox" name="subjects" value="python"/>Python
                <input type="checkbox" name="subjects" value="english"/>English
                <input type="checkbox" name="subjects" value="math"/>Math
            </p>

            <p>
                <label>Favourite day of the week:</label>
            </br>
                <input id="monday" type="radio" name="day" value="monday" />
                <label for="monday">Monday</label>
                 <input id="tuesday" type="radio" name="day" value="tuesday" />
                <label for="tuesday">Tuesday</label>
                <input id="wednesday" type="radio" name="day" value="wednesday" />
                <label for="wednesday">Wednesday</label>
                <input id="thursday" type="radio" name="day" value="thursday" />
                <label for="thursday">Thursday</label>
                <input id="friday" type="radio" name="day" value="friday" />
                <label for="friday">Friday</label>
            </p>

            <p>
                <label>Additional Comments:</label>
                <br>
                <textarea name="comments" rows="4" cols="20" placeholder="Your feedback..."></textarea>
            </p>
        </fieldset>

        <input type="submit" value="Submit Survey" />
    </body>
    </html>
